# Render Blueprint — Backend Deployment
# https://render.com/docs/blueprint-spec
#
# After connecting your GitHub repo (Masterkillerr/Gestion_Ganadera) to Render,
# this file auto-configures the web service.

services:
  - type: web
    name: gestion-ganadera-backend
    runtime: image
    repo: https://github.com/Masterkillerr/Gestion_Ganadera
    branch: master
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Uses TCP health check by default (more reliable than HTTP for Spring Boot)
    envVars:
      - key: SERVER_PORT
        value: 8080
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_DDL_AUTO
        value: update
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRATION
        value: 604800000
      - key: CORS_ALLOWED_ORIGINS
        # Comma-separated list. Supports wildcards (handled by setAllowedOriginPatterns).
        # IMPORTANT: scope wildcards to YOUR Cloudflare Pages project, never to *.pages.dev
        # (pages.dev is a shared multi-tenant domain — using *.pages.dev with credentials would
        # let any attacker's Pages project make credentialed CORS requests to this backend).
        # TODO: Replace `gestion-ganadera-front` below with the actual Cloudflare Pages project name once created.
        # The second pattern covers preview deployments (e.g. <hash>.gestion-ganadera-front.pages.dev).
        value: https://gestion-ganadera-front.pages.dev,https://*.gestion-ganadera-front.pages.dev,https://gestion-ganadera-front.alvaropro-0605.workers.dev,http://localhost:5173,http://localhost:5174,http://localhost:5175
      - key: RECAPTCHA_SECRET
        sync: false
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: LOG_LEVEL
        value: INFO
      - key: SECURITY_LOG_LEVEL
        value: INFO

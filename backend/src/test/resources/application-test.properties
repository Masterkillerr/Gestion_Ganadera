# Test Profile - H2 in-memory database
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.h2.console.enabled=false

# JWT secret must be 64+ chars for HS256
app.jwt.secret=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
app.jwt.expiration=604800000

# Disable external calls in tests
app.recaptcha.secret=

# Suppress verbose logging
logging.level.com.gestionganadera=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN

# No context path for tests — controllers at root path
# server.servlet.context-path=/api

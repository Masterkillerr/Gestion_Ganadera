server:
  port: 8080
  servlet:
    context-path: /api
  compression:
    enabled: true
    min-response-size: 1024

spring:
  application:
    name: gestion-ganadera-backend
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQL10Dialect
    show-sql: false
    properties:
      hibernate:
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
      enabled: true
  security:
    user:
      name: user
      password: password

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

app:
  cors:
    allowed-origins: http://localhost:3000, http://localhost:5173, https://d3gw8tv95pui9q.cloudfront.net
  jwt:
    secret: ${JWT_SECRET:your-secret-key-change-in-production}
    expiration: 86400000
  recaptcha:
    secret: ${RECAPTCHA_SECRET:}

logging:
  level:
    root: INFO
    com.gestionganadera.backend: DEBUG
    org.springframework.security: DEBUG

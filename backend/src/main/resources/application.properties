# Application Configuration
spring.application.name=Gestion Ganadera Backend

# Server Configuration
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/api

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.defaultModelsExpandDepth=-1

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gestion_ganadera}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:none}
spring.jpa.show-sql=${DB_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway Schema Migration
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
# NOTE: baseline-version=0 ensures V1 runs on both existing RDS (using
# CREATE TABLE IF NOT EXISTS) AND fresh databases. This single setup
# handles both scenarios without needing separate init scripts.
spring.flyway.locations=classpath:db/migration
spring.flyway.out-of-order=false

# JWT Configuration
app.jwt.secret=${JWT_SECRET:defaultSecretThatMustBeChangedInProduction}
app.jwt.expiration=${JWT_EXPIRATION:604800000}

# CORS Configuration
# Supports wildcards (handled via setAllowedOriginPatterns in SecurityConfig).
# SECURITY: scope origins to your actual CloudFront domain(s) to prevent
# unauthorized CORS access from other domains.
# Override CORS_ALLOWED_ORIGINS in production (AWS) with your real CloudFront domain(s).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176,https://d3gw8tv95pui9q.cloudfront.net}

# reCAPTCHA Configuration
app.recaptcha.secret=${RECAPTCHA_SECRET:}

# File Upload Configuration
app.upload.dir=${UPLOAD_DIR:../uploads/}
app.upload.max-size=5242880

# Logging
logging.level.com.gestionganadera=${LOG_LEVEL:INFO}
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}

# Mail (SMTP)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:}

# ── Development Profile: H2 in-memory database (no PostgreSQL required) ──

# H2 Database (PostgreSQL-compatible mode)
spring.datasource.url=jdbc:h2:mem:gestion_ganadera;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
# Let Hibernate create tables first, then Flyway seeds catalog data
spring.jpa.hibernate.ddl-auto=update

# DataSeeder handles catalog data seeding for dev (Flyway requires PostgreSQL-specific modules)

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# CORS: allow all origins in dev (local network testing)
app.cors.allowed-origins=*

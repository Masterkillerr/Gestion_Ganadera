# Application Configuration
spring.application.name=Gestion Ganadera Backend

# Server Configuration
server.port=8080
server.servlet.context-path=/api

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/gestion_ganadera
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
app.jwt.secret=YourSecretKeyForJWTTokenGenerationChangeInProduction2024!
app.jwt.expiration=604800000

# File Upload Configuration
app.upload.dir=../uploads/
app.upload.max-size=5242880

# Logging
logging.level.com.gestionganadera=DEBUG
logging.level.org.springframework.security=DEBUG

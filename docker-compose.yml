version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: gestion_ganadera_db
    environment:
      POSTGRES_DB: gestion_ganadera
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gestion_ganadera_backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Database
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/gestion_ganadera
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}

      # Server
      SERVER_PORT: 8080
      SERVER_SERVLET_CONTEXT_PATH: /api

      # JWT
      APP_JWT_SECRET: ${JWT_SECRET:-change-this-secret-key-in-production}
      APP_JWT_EXPIRATION: 86400000

      # CORS
      APP_CORS_ALLOWED_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}

      # Logging
      LOGGING_LEVEL_ROOT: INFO
      LOGGING_LEVEL_COM_GESTIONGANADERA_BACKEND: DEBUG
      LOGGING_FILE_PATH: /app/logs

      # Flyway
      FLYWAY_ENABLED: "true"
    volumes:
      - ./backend/logs:/app/logs
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - gestion_ganadera_network

  # Frontend (optional - for development)
  frontend:
    image: node:20-alpine
    container_name: gestion_ganadera_frontend
    working_dir: /app
    command: npm run dev
    environment:
      VITE_API_URL: http://localhost:8080/api
      VITE_API_TIMEOUT: 30000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - gestion_ganadera_network

volumes:
  postgres_data:
    driver: local

networks:
  gestion_ganadera_network:
    driver: bridge

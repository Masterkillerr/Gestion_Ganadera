name: Deploy Frontend to AWS CloudFront

on:
  push:
    branches: [master, main]
    paths:
      - 'frontend/**'
      - 'frontend'
      - '.github/workflows/deploy-frontend.yml'
  pull_request:
    types: [closed]
    branches: [master, main]
    paths:
      - 'frontend/**'
      - 'frontend'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

env:
  AWS_REGION: us-east-2
  S3_BUCKET: gestion-ganadera-frontend
  CF_DISTRIBUTION_ID: E36X49KRLGV2TK

jobs:
  deploy:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_RECAPTCHA_SITE_KEY: 6LdghgEtAAAAACIFocLD44eu2xdytjFDhRTkb9wA
          VITE_API_URL: https://d3gw8tv95pui9q.cloudfront.net

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        run: aws s3 sync dist/ s3://${{ env.S3_BUCKET }}/ --delete

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id ${{ env.CF_DISTRIBUTION_ID }} --paths '/*'

name: CI + Deploy

on:
  push:
    branches: [master, main]
  pull_request:
    types: [opened, synchronize, closed]
    branches: [master, main]
  workflow_dispatch:

env:
  AWS_REGION: us-east-2

# ── Shared Backend Env ──
  EB_APPLICATION: gestion_ganadera_backend
  EB_ENVIRONMENT: Gestionganaderabackend-env
  EB_S3_BUCKET: elasticbeanstalk-us-east-2-392362834988

# ── Shared Frontend Env ──
  S3_BUCKET: gestion-ganadera-frontend
  CF_DISTRIBUTION_ID: E36X49KRLGV2TK

jobs:
  # ═══════════════════════════════════════
  # JOB 1: CI — Run backend tests
  # ═══════════════════════════════════════
  test:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Build and run tests
        run: mvn test --batch-mode

      - name: Upload JaCoCo coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: backend/target/surefire-reports

  # ═══════════════════════════════════════
  # JOB 2: Deploy Backend to Elastic Beanstalk
  # ═══════════════════════════════════════
  deploy-backend:
    if: >
      (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true) || github.event_name == 'workflow_dispatch')
      && (github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || contains(join(github.event.commits.*.modified, ' '), 'backend') || contains(join(github.event.commits.*.added, ' '), 'backend') || contains(join(github.event.commits.*.modified, ' '), '.github/workflows') || contains(join(github.event.commits.*.added, ' '), '.github/workflows'))
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Wait for Environment to be Ready
        run: |
          echo "🔍 Checking environment status before deployment..."
          for i in $(seq 1 10); do
            STATUS=$(aws elasticbeanstalk describe-environments \
              --environment-names ${{ env.EB_ENVIRONMENT }} \
              --region ${{ env.AWS_REGION }} \
              --query 'Environments[0].Status' --output text)

            if [ "$STATUS" = "Ready" ]; then
              echo "✅ Environment is Ready."
              exit 0
            fi
            echo "⏳ Environment status is $STATUS. Waiting... ($i/10)"
            sleep 30
          done
          echo "❌ Timeout: Environment not ready."
          exit 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Build JAR
        run: mvn clean package -DskipTests -B

      - name: Generate version label
        id: version
        run: echo "label=$(git rev-parse --short HEAD)-$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Create source bundle
        run: |
          mkdir -p deploy
          cp target/*.jar deploy/application.jar
          cd deploy
          zip -r ../backend-${{ steps.version.outputs.label }}.zip .

      - name: Upload to S3
        run: |
          aws s3 cp backend-${{ steps.version.outputs.label }}.zip \
            s3://${{ env.EB_S3_BUCKET }}/backend/

      - name: Create application version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name ${{ env.EB_APPLICATION }} \
            --version-label ${{ steps.version.outputs.label }} \
            --source-bundle S3Bucket="${{ env.EB_S3_BUCKET }}",S3Key="backend/backend-${{ steps.version.outputs.label }}.zip" \
            --region ${{ env.AWS_REGION }} \
            --auto-create-application

      - name: Deploy to Elastic Beanstalk
        run: |
          aws elasticbeanstalk update-environment \
            --environment-name ${{ env.EB_ENVIRONMENT }} \
            --version-label ${{ steps.version.outputs.label }} \
            --region ${{ env.AWS_REGION }}

      - name: Wait for deployment to complete
        run: |
          echo "⏳ Waiting for deployment to finish..."
          for i in $(seq 1 30); do
            ENV_JSON=$(aws elasticbeanstalk describe-environments \
              --environment-names ${{ env.EB_ENVIRONMENT }} \
              --region ${{ env.AWS_REGION }})
            STATUS=$(echo "$ENV_JSON" | jq -r '.Environments[0].Status')
            HEALTH=$(echo "$ENV_JSON" | jq -r '.Environments[0].Health')
            VERSION=$(echo "$ENV_JSON" | jq -r '.Environments[0].VersionLabel')
            echo "   [$i/30] Status=$STATUS  Health=$HEALTH  Version=$VERSION"
            if [ "$STATUS" = "Ready" ]; then
              echo ""
              if [ "$HEALTH" = "Green" ] || [ "$HEALTH" = "Grey" ]; then
                echo "✅ Deployment complete! Version: $VERSION"
                echo "   URL: https://${{ env.EB_ENVIRONMENT }}.eba-kmujbtjg.us-east-2.elasticbeanstalk.com"
                exit 0
              else
                echo "❌ Deployment finished but health is $HEALTH — check EB console"
                exit 1
              fi
            fi
            sleep 20
          done
          echo "❌ Timeout waiting for deployment"
          exit 1

  # ═══════════════════════════════════════
  # JOB 3: Deploy Frontend to CloudFront
  # ═══════════════════════════════════════
  deploy-frontend:
    if: >
      (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true) || github.event_name == 'workflow_dispatch')
      && (github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || contains(join(github.event.commits.*.modified, ' '), 'frontend') || contains(join(github.event.commits.*.added, ' '), 'frontend') || contains(join(github.event.commits.*.modified, ' '), '.github/workflows') || contains(join(github.event.commits.*.added, ' '), '.github/workflows'))
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_RECAPTCHA_SITE_KEY: 6LdghgEtAAAAACIFocLD44eu2xdytjFDhRTkb9wA
          VITE_API_URL: https://d3gw8tv95pui9q.cloudfront.net

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        run: aws s3 sync dist/ s3://${{ env.S3_BUCKET }}/ --delete

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id ${{ env.CF_DISTRIBUTION_ID }} --paths '/*'

name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Build and run tests
        run: mvn test --batch-mode

      - name: Upload JaCoCo coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: backend/target/surefire-reports

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-2

      # Backend build & deploy
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Build backend
        run: |
          cd backend
          mvn clean package -DskipTests

      - name: Upload backend JAR to S3
        run: |
          aws s3 cp backend/target/backend-1.0.0.jar s3://gestion-ganadera-builds/backend.jar

      - name: Create EB application version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name GestionGanadera \
            --version-label ${{ github.sha }} \
            --source-bundle S3Bucket="gestion-ganadera-builds",S3Key="backend.jar"

      - name: Update EB environment
        run: |
          aws elasticbeanstalk update-environment \
            --environment-name Gestionganaderabackend-env \
            --version-label ${{ github.sha }}

      # Frontend build & deploy
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Sync frontend to S3
        run: |
          aws s3 sync frontend/dist/ s3://gestion-ganadera-frontend --delete --region us-east-2

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation --distribution-id E36X49KRLGV2TK --paths "/*"